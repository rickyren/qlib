name: Test qlib from source slow

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}

on:
  pull_request:
    branches: [ main ]

jobs:
  build:
    timeout-minutes: 720
    # we may retry for 3 times for `Unit tests with Pytest`

    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # Keep the fork's slow gate aligned with its only supported macOS Intel
        # deployment environment. Upstream owns broader release compatibility.
        os: [macos-15-intel]
        python-version: ["3.14"]

    steps:
    - name: Test qlib from source slow
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install fork runtime and test tools
      run: |
        make prerequisite
        python -m pip install --no-cache-dir -e ".[dev,test,analysis]"

    - name: Use stable OSQP on Windows Python 3.8
      # Current OSQP/QDLDL cp38 Windows wheels crash during pytest collection on hosted runners.
      # Remove these pins after fixed OSQP/QDLDL wheels are available or Python 3.8 support ends.
      if: ${{ matrix.os == 'windows-latest' && matrix.python-version == '3.8' }}
      run: |
        python -m pip install "osqp==0.6.7.post3" "qdldl==0.1.7.post4"
        python -c "import cvxpy, osqp, qdldl; assert osqp.__version__ == '0.6.7.post3'; print(cvxpy.__version__, osqp.__version__, qdldl.__file__)"

    - name: Downloads dependencies data
      run: |
        python scripts/get_data.py qlib_data --name qlib_data_simple --target_dir ~/.qlib/qlib_data/cn_data --interval 1d --region cn

    - name: Install Lightgbm for MacOS
      if: ${{ matrix.os == 'macos-14' || matrix.os == 'macos-15' || matrix.os == 'macos-15-intel' }}
      run: |
        brew update
        brew install libomp || brew reinstall libomp
        python -m pip install --no-binary=:all: lightgbm

    - name: Unit tests with Pytest
      # Slow compatibility tests explicitly exercise legacy file: experiment URIs.
      # Remove after those fixtures migrate to SQLite or MLflow restores FileStore support.
      env:
        MLFLOW_ALLOW_FILE_STORE: "true"
      uses: nick-fields/retry@v2
      with:
        timeout_minutes: 240
        max_attempts: 3
        command: |
          cd tests
          python -m pytest . -m "slow" --durations=0
