name: Test qlib from pip

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    timeout-minutes: 120

    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-24.04, ubuntu-22.04, macos-14, macos-15]
        # In github action, using python 3.7, pip install will not match the latest version of the package.
        # Also, python 3.7 is no longer supported from macos-14, and will be phased out from macos-13 in the near future.
        # All things considered, we have removed python 3.7.
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]

    steps:
    - name: Test qlib from pip
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Update pip to the latest version
      run: |
        python -m pip install --upgrade pip
      
    - name: Qlib installation test
      run: |
        python -m pip install pyqlib

    - name: Use stable OSQP on Windows Python 3.8
      # Current OSQP/QDLDL cp38 Windows wheels crash during pytest collection on hosted runners.
      # Remove these pins after fixed OSQP/QDLDL wheels are available or Python 3.8 support ends.
      if: ${{ matrix.os == 'windows-latest' && matrix.python-version == '3.8' }}
      run: |
        python -m pip install "osqp==0.6.7.post3" "qdldl==0.1.7.post4"
        python -c "import cvxpy, osqp, qdldl; assert osqp.__version__ == '0.6.7.post3'; print(cvxpy.__version__, osqp.__version__, qdldl.__file__)"

    - name: Install Lightgbm for MacOS
      if: ${{ matrix.os == 'macos-14' || matrix.os == 'macos-15' }}
      run: |
        brew update
        brew install libomp || brew reinstall libomp
        python -m pip install --no-binary=:all: lightgbm

    - name: Downloads dependencies data
      run: |
        cd ..
        python -m qlib.cli.data qlib_data --target_dir ~/.qlib/qlib_data/cn_data --region cn
        cd qlib

    - name: Test workflow by config
      # The released pyqlib 0.9.7 qrun still selects MLflow's legacy FileStore.
      # Remove this bridge after PyPI publishes Qlib's SQLite-default runtime fix.
      env:
        MLFLOW_ALLOW_FILE_STORE: "true"
      run: |
        qrun examples/benchmarks/LightGBM/workflow_config_lightgbm_Alpha158.yaml
